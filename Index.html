<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --ink2:#4E5968; --ink3:#8B95A1; --line:#E5E8EB;
  --accent:#1EC28B; --accent-d:#13A273; --accent-soft:#E6F8F1;
  --red:#F04452; --blue:#3182F6;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(25,31,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.02em}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

.app{max-width:1080px;margin:0 auto;padding:28px 20px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#1EC28B,#0FA3B1);display:grid;place-items:center;color:#fff;font-size:17px}
.month-nav{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.month-nav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .15s}
.month-nav button:hover{background:var(--bg)}
.month-nav .label{min-width:104px;text-align:center;font-weight:700;font-size:15px}

.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.grid{grid-template-columns:1.05fr 1fr;align-items:start}.col-right{position:sticky;top:20px}}
.card{background:var(--card);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow)}
.card h2{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-size:13px;font-weight:500;color:var(--ink3)}

/* hero */
.hero{background:linear-gradient(140deg,#16B884 0%,#0E9FA8 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;right:40px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .cap{font-size:14px;opacity:.85;font-weight:500}
.hero .total{font-size:38px;font-weight:800;margin:6px 0 14px;letter-spacing:-.03em}
.hero .total span{font-size:24px;font-weight:700;margin-left:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}

/* form */
.form{display:grid;gap:14px}
.field label{display:block;font-size:13px;color:var(--ink3);font-weight:500;margin-bottom:6px}
.field input{width:100%;height:52px;border:1.5px solid transparent;background:var(--bg);border-radius:var(--r-sm);padding:0 16px;font-size:16px;outline:none;transition:border .15s,background .15s}
.field input:focus{border-color:var(--accent);background:#fff}
.amount-wrap{position:relative}
.amount-wrap input{font-size:22px;font-weight:700;padding-right:44px}
.amount-wrap .won{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--ink3);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:520px){.cats{grid-template-columns:repeat(5,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:var(--r-sm);background:var(--bg);font-size:12.5px;font-weight:500;color:var(--ink2);border:1.5px solid transparent;transition:all .15s}
.cat .ic{font-size:20px;line-height:1}
.cat:hover{background:#EAEDF0}
.cat.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-d);font-weight:700}
.btn-primary{height:54px;border-radius:var(--r-md);background:var(--accent);color:#fff;font-size:16px;font-weight:700;transition:background .15s,transform .1s}
.btn-primary:hover{background:var(--accent-d)}
.btn-primary:active{transform:scale(.98)}
.err{color:var(--red);font-size:13px;min-height:0}

/* chart */
.chart-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.donut{position:relative;width:180px;height:180px;flex:none;margin:0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .center b{display:block;font-size:20px;font-weight:800}
.donut .center small{font-size:12px;color:var(--ink3)}
.donut circle.seg{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1),stroke-width .2s;cursor:pointer}
.donut circle.seg:hover{stroke-width:26}
.bars{flex:1;min-width:240px;display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar-row .nm{display:flex;align-items:center;gap:8px;min-width:96px;font-weight:500}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar-row .amt{text-align:right;font-weight:700;white-space:nowrap}
.bar-row .amt small{display:block;font-size:11.5px;color:var(--ink3);font-weight:500}

/* list */
.toolbar{display:flex;gap:8px}
.ghost{font-size:13px;font-weight:600;color:var(--ink2);background:var(--bg);padding:7px 12px;border-radius:999px;transition:background .15s}
.ghost:hover{background:#E5E8EB}
.day{margin-top:18px}
.day:first-child{margin-top:0}
.day-head{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);font-weight:600;padding:0 4px 8px;border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:14px;padding:12px 4px;border-radius:var(--r-sm);transition:background .15s;position:relative}
.item:hover{background:#F9FAFB}
.item .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info small{font-size:12.5px;color:var(--ink3)}
.item .price{font-weight:700;font-size:15px;white-space:nowrap}
.item .del{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);opacity:0;transition:opacity .15s,background .15s}
.item:hover .del,.item .del:focus{opacity:1}
.item .del:hover{background:#FDECEE;color:var(--red)}
@media(hover:none){.item .del{opacity:1}}
.item.new{animation:pop .45s ease}
@keyframes pop{from{background:var(--accent-soft)}to{background:transparent}}

.empty{text-align:center;padding:36px 12px;color:var(--ink3)}
.empty .big{font-size:40px;margin-bottom:10px}
.empty p{font-size:14px;line-height:1.6}
.empty button{margin-top:14px}

/* toast & modal */
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:rgba(25,31,40,.92);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);padding:24px;max-width:340px;width:100%;animation:up .2s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{font-size:14px;color:var(--ink2);line-height:1.5}
.modal .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.modal .acts button{height:48px;border-radius:var(--r-sm);font-weight:700}
.modal .cancel{background:var(--bg)}
.modal .danger{background:var(--red);color:#fff}
.note{font-size:12px;color:var(--ink3);text-align:center;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">₩</div>가계부</div>
    <div class="month-nav">
      <button id="prev" aria-label="이전 달">‹</button>
      <div class="label" id="monthLabel"></div>
      <button id="next" aria-label="다음 달">›</button>
    </div>
  </header>

  <div class="grid">
    <div class="col-left" style="display:grid;gap:16px">
      <section class="card hero">
        <div class="cap" id="heroCap">이번 달 쓴 돈</div>
        <div class="total num" id="total">0<span>원</span></div>
        <div class="chips">
          <div class="chip" id="chipCount">0건</div>
          <div class="chip" id="chipAvg">하루 평균 0원</div>
          <div class="chip" id="chipDiff">지난달 대비 -</div>
        </div>
      </section>

      <section class="card">
        <h2>지출 기록하기</h2>
        <form class="form" id="form" autocomplete="off">
          <div class="field">
            <label for="amount">금액</label>
            <div class="amount-wrap">
              <input id="amount" inputmode="numeric" placeholder="0" class="num">
              <span class="won">원</span>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="date">날짜</label>
              <input id="date" type="date">
            </div>
            <div class="field">
              <label for="place">사용처</label>
              <input id="place" placeholder="예: 스타벅스" maxlength="40">
            </div>
          </div>
          <div class="field">
            <label>분류</label>
            <div class="cats" id="cats"></div>
          </div>
          <div class="err" id="err"></div>
          <button class="btn-primary" type="submit">기록하기</button>
        </form>
      </section>

      <section class="card">
        <h2>분류별 지출 <small id="chartSub"></small></h2>
        <div id="chartArea"></div>
      </section>
    </div>

    <div class="col-right">
      <section class="card">
        <h2>
          <span>지출 내역</span>
          <div class="toolbar"><button class="ghost" id="copyCsv">CSV 복사</button></div>
        </h2>
        <div id="list"></div>
      </section>
      <p class="note">기록은 지금 쓰는 브라우저에만 저장돼요.<br>다른 기기·브라우저에서는 보이지 않아요.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>이 내역을 삭제할까요?</h3>
    <p id="modalText"></p>
    <div class="acts">
      <button class="cancel" id="mCancel">취소</button>
      <button class="danger" id="mOk">삭제</button>
    </div>
  </div>
</div>

<script>
const CATS = [
  {id:'food',  name:'식비',     ic:'🍚', c:'#FF8A3D'},
  {id:'cafe',  name:'카페·간식', ic:'☕', c:'#B07A4F'},
  {id:'trans', name:'교통',     ic:'🚇', c:'#3182F6'},
  {id:'shop',  name:'쇼핑',     ic:'🛍️', c:'#E5508C'},
  {id:'life',  name:'생활',     ic:'🏠', c:'#1EC28B'},
  {id:'med',   name:'의료',     ic:'💊', c:'#F04452'},
  {id:'fun',   name:'문화·여가', ic:'🎬', c:'#8B5CF6'},
  {id:'event', name:'경조사',   ic:'💐', c:'#F5B800'},
  {id:'etc',   name:'기타',     ic:'📦', c:'#8B95A1'},
];
const catOf = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];
const KEY = 'gagyebu.v1';
const won = n => Math.round(n).toLocaleString('ko-KR');
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const esc = s => s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) { items = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e) {} };

let view = new Date(); view.setDate(1);
let selCat = 'food';
let lastAdded = null;

// category buttons
const catsEl = document.getElementById('cats');
catsEl.innerHTML = CATS.map(c=>`<button type="button" class="cat${c.id===selCat?' on':''}" data-id="${c.id}"><span class="ic">${c.ic}</span>${c.name}</button>`).join('');
catsEl.addEventListener('click', e=>{
  const b = e.target.closest('.cat'); if(!b) return;
  selCat = b.dataset.id;
  catsEl.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on', x===b));
});

// amount formatting
const amountEl = document.getElementById('amount');
amountEl.addEventListener('input', ()=>{
  const v = amountEl.value.replace(/[^\d]/g,'').slice(0,10);
  amountEl.value = v ? Number(v).toLocaleString('ko-KR') : '';
});
document.getElementById('date').value = todayStr();

document.getElementById('form').addEventListener('submit', e=>{
  e.preventDefault();
  const amt = Number(amountEl.value.replace(/[^\d]/g,''));
  const date = document.getElementById('date').value;
  const place = document.getElementById('place').value.trim();
  const err = document.getElementById('err');
  if(!amt){ err.textContent='금액을 입력해 주세요.'; amountEl.focus(); return; }
  if(!date){ err.textContent='날짜를 선택해 주세요.'; return; }
  if(!place){ err.textContent='사용처를 입력해 주세요.'; document.getElementById('place').focus(); return; }
  err.textContent='';
  const it = {id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), date, amount:amt, place, cat:selCat};
  items.push(it); save(); lastAdded = it.id;
  const [y,m] = date.split('-').map(Number);
  view = new Date(y, m-1, 1);
  amountEl.value=''; document.getElementById('place').value='';
  render(); toast(`${won(amt)}원 기록했어요`);
  amountEl.focus();
});

document.getElementById('prev').onclick = ()=>{ view.setMonth(view.getMonth()-1); render(); };
document.getElementById('next').onclick = ()=>{ view.setMonth(view.getMonth()+1); render(); };

function monthKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function inMonth(d){ const k=monthKey(d); return items.filter(i=>i.date.startsWith(k)); }

function render(){
  const y=view.getFullYear(), m=view.getMonth()+1;
  const now=new Date(); const isThis = y===now.getFullYear() && m===now.getMonth()+1;
  document.getElementById('monthLabel').textContent = `${y}년 ${m}월`;
  document.getElementById('heroCap').textContent = isThis ? '이번 달 쓴 돈' : `${m}월에 쓴 돈`;

  const list = inMonth(view);
  const total = list.reduce((s,i)=>s+i.amount,0);
  document.getElementById('total').innerHTML = `${won(total)}<span>원</span>`;
  document.getElementById('chipCount').textContent = `${list.length}건`;
  const days = isThis ? now.getDate() : new Date(y,m,0).getDate();
  document.getElementById('chipAvg').textContent = `하루 평균 ${won(total/days)}원`;
  const pv = new Date(y, m-2, 1);
  const prevTotal = inMonth(pv).reduce((s,i)=>s+i.amount,0);
  const diff = total - prevTotal;
  document.getElementById('chipDiff').textContent = prevTotal===0 && total===0 ? '지난달 대비 -'
    : `지난달보다 ${won(Math.abs(diff))}원 ${diff>=0?'더 씀 ▲':'덜 씀 ▼'}`;

  renderChart(list, total);
  renderList(list);
}

function renderChart(list, total){
  const area = document.getElementById('chartArea');
  const sums = CATS.map(c=>({...c, sum:list.filter(i=>i.cat===c.id).reduce((s,i)=>s+i.amount,0)}))
    .filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);
  document.getElementById('chartSub').textContent = sums.length ? `${sums.length}개 분류` : '';
  if(!sums.length){
    area.innerHTML = `<div class="empty"><div class="big">📊</div><p>지출을 기록하면<br>분류별 그래프가 여기에 나타나요.</p></div>`;
    return;
  }
  const R=70, C=2*Math.PI*R; let off=0;
  const segs = sums.map(s=>{
    const len = s.sum/total*C;
    const gap = sums.length>1 ? 2 : 0;
    const seg = `<circle class="seg" cx="90" cy="90" r="${R}" fill="none" stroke="${s.c}" stroke-width="22"
      stroke-dasharray="0 ${C}" data-dash="${Math.max(len-gap,0.01)} ${C}" stroke-dashoffset="${-off}"><title>${s.name} ${won(s.sum)}원</title></circle>`;
    off += len; return seg;
  }).join('');
  const top = sums[0];
  area.innerHTML = `
    <div class="chart-wrap">
      <div class="donut">
        <svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="${R}" fill="none" stroke="#F2F4F6" stroke-width="22"/>${segs}</svg>
        <div class="center"><div><small>가장 많이 쓴 곳</small><b>${top.ic} ${top.name}</b><small>${Math.round(top.sum/total*100)}%</small></div></div>
      </div>
      <div class="bars">
        ${sums.map(s=>`
          <div class="bar-row">
            <div class="nm"><span class="dot" style="background:${s.c}"></span>${s.name}</div>
            <div class="track"><div class="fill" style="background:${s.c}" data-w="${s.sum/sums[0].sum*100}"></div></div>
            <div class="amt num">${won(s.sum)}원<small>${(s.sum/total*100).toFixed(1)}%</small></div>
          </div>`).join('')}
      </div>
    </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    area.querySelectorAll('.seg').forEach(el=>el.setAttribute('stroke-dasharray', el.dataset.dash));
    area.querySelectorAll('.fill').forEach(el=>el.style.width = el.dataset.w+'%');
  }));
}

const WD = ['일','월','화','수','목','금','토'];
function renderList(list){
  const el = document.getElementById('list');
  if(!list.length){
    el.innerHTML = `<div class="empty"><div class="big">🧾</div><p>이 달에 기록된 지출이 없어요.<br>왼쪽에서 첫 지출을 기록해 보세요.</p>
      ${items.length===0 ? '<button class="ghost" id="sample">예시 데이터로 둘러보기</button>' : ''}</div>`;
    const s = document.getElementById('sample'); if(s) s.onclick = addSample;
    return;
  }
  const byDay = {};
  [...list].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id))
    .forEach(i=>(byDay[i.date] ||= []).push(i));
  el.innerHTML = Object.entries(byDay).map(([d,arr])=>{
    const dt = new Date(d+'T00:00:00');
    const sum = arr.reduce((s,i)=>s+i.amount,0);
    return `<div class="day">
      <div class="day-head"><span>${dt.getMonth()+1}월 ${dt.getDate()}일 (${WD[dt.getDay()]})</span><span class="num">-${won(sum)}원</span></div>
      ${arr.map(i=>{ const c=catOf(i.cat); return `
        <div class="item${i.id===lastAdded?' new':''}">
          <div class="ico" style="background:${c.c}1F">${c.ic}</div>
          <div class="info"><b>${esc(i.place)}</b><small>${c.name}</small></div>
          <div class="price num">-${won(i.amount)}원</div>
          <button class="del" data-id="${i.id}" aria-label="삭제">✕</button>
        </div>`;}).join('')}
    </div>`;
  }).join('');
  lastAdded = null;
}

// delete with in-page confirm
let pendingDel = null;
const modal = document.getElementById('modal');
document.getElementById('list').addEventListener('click', e=>{
  const b = e.target.closest('.del'); if(!b) return;
  const it = items.find(i=>i.id===b.dataset.id); if(!it) return;
  pendingDel = it.id;
  document.getElementById('modalText').textContent = `${it.date} · ${it.place} · ${won(it.amount)}원`;
  modal.classList.add('show');
});
document.getElementById('mCancel').onclick = ()=>{ modal.classList.remove('show'); pendingDel=null; };
modal.addEventListener('click', e=>{ if(e.target===modal){ modal.classList.remove('show'); pendingDel=null; }});
document.getElementById('mOk').onclick = ()=>{
  items = items.filter(i=>i.id!==pendingDel); save();
  modal.classList.remove('show'); pendingDel=null; render(); toast('삭제했어요');
};

// CSV copy
document.getElementById('copyCsv').onclick = async ()=>{
  const list = inMonth(view).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length){ toast('복사할 내역이 없어요'); return; }
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const csv = ['날짜,사용처,분류,금액', ...list.map(i=>[i.date,q(i.place),catOf(i.cat).name,i.amount].join(','))].join('\n');
  try { await navigator.clipboard.writeText(csv); toast('CSV를 복사했어요. 엑셀에 붙여넣기 하세요'); }
  catch(e){ toast('복사가 막혀 있어요. 브라우저 권한을 확인해 주세요'); }
};

function addSample(){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth()+1, d=n.getDate();
  const day = k => `${y}-${pad(m)}-${pad(Math.max(1, d-k))}`;
  const s = [
    [0,'김밥천국',8500,'food'],[0,'스타벅스',6100,'cafe'],[1,'지하철',1550,'trans'],
    [1,'이마트',54200,'life'],[2,'CGV',15000,'fun'],[3,'무신사',89000,'shop'],
    [4,'약국',12400,'med'],[5,'회사 앞 한식뷔페',9000,'food'],[6,'카카오T',13800,'trans'],
  ];
  s.forEach(([k,p,a,c],idx)=>items.push({id:'s'+idx+Date.now().toString(36),date:day(k),amount:a,place:p,cat:c}));
  save(); view=new Date(y,m-1,1); render(); toast('예시 데이터를 넣었어요');
}

let tt;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

render();
